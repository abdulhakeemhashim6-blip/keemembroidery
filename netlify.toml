# ═══════════════════════════════════════════════
#  Keem Embroidery & Stitches — Netlify Config
#  Upload this file alongside index.html
# ═══════════════════════════════════════════════

[build]
  publish = "."

# ── Force HTTPS on custom domain ──
[[redirects]]
  from = "http://keemembroidery.com/*"
  to   = "https://keemembroidery.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.keemembroidery.com/*"
  to   = "https://keemembroidery.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.keemembroidery.com/*"
  to   = "https://keemembroidery.com/:splat"
  status = 301
  force  = true

# ── Fallback: all routes go to index.html ──
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security & performance headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets aggressively ──
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
